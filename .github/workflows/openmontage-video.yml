name: OpenMontage - Free Model Preflight

on:
  push:
    paths:
      - '.github/workflows/openmontage-video.yml'
      - 'openmontage/four-crossings-brief.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  free-model-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production brief
        uses: actions/checkout@v4
      - name: Validate brief and no-key requirements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('openmontage/four-crossings-brief.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data['title'] and data['brief']
          assert data.get('ratio') == '16:9'
          print('Brief valid:',data['title'])
          print('No paid model API keys required for this preflight.')
          PY
      - name: Fetch official OpenMontage and check free video backends
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/charliewwdev/OpenMontage.git upstream
          test -s upstream/docs/PROVIDERS.md
          test -s upstream/studio/server/app.py
          python3 - <<'PY'
          from pathlib import Path
          doc=Path('upstream/docs/PROVIDERS.md').read_text(encoding='utf-8')
          for term in ('ComfyUI','WAN','Local GPU'):
              if term.lower() not in doc.lower():
                  raise SystemExit('Missing expected free video provider documentation: '+term)
          print('OpenMontage source verified; local video generation backends documented.')
          PY
      - name: Report realistic runtime capabilities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          {
            echo '# OpenMontage no-API preflight'
            echo 'The production brief and official OpenMontage repository were verified.'
            echo 'Free genuine AI video generation requires an available GPU (e.g. self-hosted ComfyUI/Wan).'
            echo 'GitHub-hosted ubuntu-latest does not provide an NVIDIA GPU.'
            echo 'No video was generated by this preflight; it does not fabricate MP4 files.'
          } > output/RESULT.md
          cat output/RESULT.md
      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: openmontage-free-preflight-report
          path: output/RESULT.md
          if-no-files-found: error
