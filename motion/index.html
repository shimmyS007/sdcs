<!doctype html><html lang="zh-CN"><meta charset="utf-8"><style>*{box-sizing:border-box}body{margin:0;background:#091017;color:#f6ead2;font-family:"Noto Sans CJK SC",sans-serif;overflow:hidden}#stage{position:relative;width:1920px;height:1080px;background:radial-gradient(ellipse at 67% 50%,#263630,#080e14 72%)}svg{position:absolute;inset:0}#overlay{position:absolute;inset:0;background:linear-gradient(90deg,#080d13f2 0%,#080d13cf 35%,transparent 80%)}#kicker{position:absolute;top:110px;left:110px;color:#e7bd7b;font-size:24px;letter-spacing:8px}#copy{position:absolute;left:110px;top:330px;width:760px}#rule{width:110px;height:7px;background:#c73e38;margin-bottom:45px}#title{font-size:100px;font-weight:900;letter-spacing:8px;line-height:1.2}#sub{font-size:35px;color:#e7bd7b;margin-top:25px}#body{font-size:31px;line-height:1.7;margin-top:42px}#note{position:absolute;bottom:72px;left:110px;font-size:20px;color:#b2afa2}#counter{position:absolute;bottom:72px;right:100px;color:#e7bd7b;font-size:24px}#bar{position:absolute;bottom:0;left:0;height:6px;background:#d64c43;width:0}.place{fill:#eee0bf;font-size:25px}.enemy{fill:#6585a4;stroke:#c0d3e6;stroke-width:2}.path{fill:none;stroke:#e54e46;stroke-width:8;stroke-linecap:round;stroke-dasharray:15 13}</style><div id="stage"><svg viewBox="0 0 1920 1080"><defs><pattern id="grid" width="90" height="90" patternUnits="userSpaceOnUse"><path d="M90 0H0V90" stroke="#c3bfa0" opacity=".1" fill="none"/></pattern></defs><rect width="1920" height="1080" fill="url(#grid)"/><g id="terrain"></g><path d="M1050 -30 C990 150 1110 240 1020 340 S870 580 1010 700 S1110 900 1000 1110" stroke="#2b6974" stroke-width="42" opacity=".35" fill="none"/><path d="M1050 -30 C990 150 1110 240 1020 340 S870 580 1010 700 S1110 900 1000 1110" stroke="#8bc7c9" stroke-width="8" fill="none"/><text x="1050" y="240" fill="#9bd4d6" font-size="29" letter-spacing="9" transform="rotate(75 1050 240)">赤水河</text><g id="places"></g><g id="routes"></g><g id="forces"></g></svg><div id="overlay"></div><div id="kicker">1935 / 中国工农红军长征</div><div id="copy"><div id="rule"></div><div id="title"></div><div id="sub"></div><div id="body"></div></div><div id="note">战役地理与行军路线示意 · 非精确兵力部署图</div><div id="counter"></div><div id="bar"></div></div><script>
const NS='http://www.w3.org/2000/svg', terrain=document.querySelector('#terrain'),places=document.querySelector('#places'),routes=document.querySelector('#routes'),forces=document.querySelector('#forces');
for(let i=0;i<25;i++){let p=document.createElementNS(NS,'path');p.setAttribute('d',`M ${170+i*44} -90 Q ${80+i*45} 350 ${410+i*30} 560 T ${210+i*49} 1200`);p.setAttribute('stroke','#849986');p.setAttribute('stroke-width',i%4===0?'4':'2');p.setAttribute('opacity',.12+(i%3)*.03);p.setAttribute('fill','none');terrain.appendChild(p)}
const ps=[[1110,520,'土城'],[760,360,'川南'],[1460,760,'遵义'],[1060,430,'茅台'],[1430,690,'黔北'],[740,860,'乌江方向']];
for(const [x,y,n] of ps){let c=document.createElementNS(NS,'circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',7);c.setAttribute('fill','#e7bd7b');places.appendChild(c);let t=document.createElementNS(NS,'text');t.setAttribute('x',x+17);t.setAttribute('y',y-16);t.setAttribute('class','place');t.textContent=n;places.appendChild(t)}
for(let i=0;i<8;i++){let x=1210+i%3*110,y=260+Math.floor(i/3)*130;let r=document.createElementNS(NS,'rect');r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',70);r.setAttribute('height',35);r.setAttribute('class','enemy');forces.appendChild(r);let t=document.createElementNS(NS,'text');t.setAttribute('x',x+35);t.setAttribute('y',y+25);t.setAttribute('font-size',19);t.setAttribute('fill','white');t.setAttribute('text-anchor','middle');t.textContent='敌军';forces.appendChild(t)}
const paths=['M1110 520 Q930 450 760 360','M760 360 Q900 520 1100 650 Q1300 710 1460 760','M1460 760 Q1290 540 1060 430 Q880 330 760 360','M760 360 Q890 470 1060 560 Q1250 650 1430 690','M1430 690 Q1280 850 1050 910 Q870 960 740 860'];
const rs=paths.map(d=>{let p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('class','path');routes.appendChild(p);return p});
const scenes=[
['四渡赤水','战略的主动权','1935 · 长征途中 · 历史军事地图纪录片',0],
['困局与选择','遵义会议后 · 1935年1月','强敌围追堵截，中央红军在运动中寻找突破口。',0],
['一渡赤水','1935年1月29日','土城战斗后，由土城、元厚一带西渡赤水。',1],
['二渡赤水','1935年2月18日至21日','东渡赤水，回师黔北，随后取得娄山关、遵义战斗胜利。',2],
['三渡赤水','1935年3月16日至17日','从茅台附近再次西渡，诱使敌军调整部署。',3],
['四渡赤水','1935年3月21日至22日','再次东渡赤水，继续实施灵活机动。',4],
['跳出合围','南渡乌江 · 西进云南','调动敌军，最终渡过金沙江，摆脱围追堵截。',5],
['战略的主动权','实事求是 · 避实击虚','根据敌我态势变化不断调整行动方向。',5]];
function render(t){t=Math.max(0,Math.min(239.999,t));let i=Math.min(7,Math.floor(t/30)),s=scenes[i],local=t-i*30,opacity=Math.min(1,local/1.4);document.querySelector('#title').textContent=s[0];document.querySelector('#sub').textContent=s[1];document.querySelector('#body').textContent=s[2];document.querySelector('#copy').style.opacity=opacity;document.querySelector('#copy').style.transform=`translateY(${(1-opacity)*32}px)`;document.querySelector('#counter').textContent=String(i+1).padStart(2,'0')+' / 08';document.querySelector('#bar').style.width=(t/240*100)+'%';rs.forEach((p,j)=>{p.style.opacity=j<s[3]?(j===s[3]-1?1:.24):0;let len=p.getTotalLength();p.style.strokeDasharray=j===s[3]-1?`${len*Math.min(1,local/9)} ${len}`:'15 13';p.style.strokeDashoffset=0});terrain.style.transform=`translateX(${-t*.35}px)`;}
window.renderFrame=render;render(0);
</script></html>
