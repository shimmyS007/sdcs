name: Wan 2.2 AI Video (real GPU inference)

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'English cinematic shot prompt'
        required: true
        default: 'Cinematic historical reenactment, 1935 southwest China, Red Army soldiers marching along a misty mountain path at dawn, period-accurate clothing, natural camera tracking movement, dramatic soft light, realistic motion, no captions, no text overlays'
        type: string
      seed:
        description: 'Random seed (-1 for random)'
        required: true
        default: '-1'
        type: string

permissions:
  contents: read

jobs:
  generate-real-video:
    # Register a Linux NVIDIA GPU self-hosted runner with labels: self-hosted, linux, gpu.
    # GitHub-hosted standard ubuntu-latest does not provide the required 24GB CUDA GPU.
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 180
    env:
      HF_HOME: ${{ runner.temp }}/huggingface
    steps:
      - name: Check NVIDIA GPU and VRAM
        shell: bash
        run: |
          set -euo pipefail
          nvidia-smi
          python3 - <<'PY'
          import subprocess
          out=subprocess.check_output(['nvidia-smi','--query-gpu=memory.total','--format=csv,noheader,nounits'],text=True)
          mem=[int(x.strip()) for x in out.splitlines() if x.strip()]
          if not mem or max(mem)<24576:
              raise SystemExit('Wan2.2 TI2V-5B requires a CUDA GPU with at least 24GB VRAM; no suitable GPU found.')
          print('GPU memory check passed:',mem)
          PY
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: '**/requirements*.txt'
        continue-on-error: true
      - name: Clone official Wan 2.2
        run: git clone --depth 1 https://github.com/Wan-Video/Wan2.2.git wan2.2
      - name: Install CUDA dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -r wan2.2/requirements.txt
          python3 -m pip install 'huggingface_hub[cli]'
      - name: Download official TI2V-5B model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p models/Wan2.2-TI2V-5B
          hf download Wan-AI/Wan2.2-TI2V-5B --local-dir models/Wan2.2-TI2V-5B
      - name: Generate real AI video
        shell: bash
        env:
          VIDEO_PROMPT: ${{ inputs.prompt }}
          VIDEO_SEED: ${{ inputs.seed }}
        run: |
          set -euo pipefail
          mkdir -p output
          cd wan2.2
          python3 generate.py \
            --task ti2v-5B \
            --size '1280*704' \
            --ckpt_dir ../models/Wan2.2-TI2V-5B \
            --offload_model True \
            --convert_model_dtype \
            --t5_cpu \
            --base_seed "$VIDEO_SEED" \
            --prompt "$VIDEO_PROMPT" \
            --save_file ../output/wan22-cinematic-test.mp4
          test -s ../output/wan22-cinematic-test.mp4
      - name: Upload actual model-generated MP4
        uses: actions/upload-artifact@v4
        with:
          name: wan22-real-ai-video
          path: output/wan22-cinematic-test.mp4
          if-no-files-found: error
