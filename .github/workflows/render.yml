name: Render Chishui documentary
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/render.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check compositions
        run: npx remotion compositions src/index.ts
      - name: Render MP4
        run: npm run render
      - name: Verify MP4
        run: |
          test -s out/chishui.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 out/chishui.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: chishui-documentary-mp4
          path: out/chishui.mp4
          if-no-files-found: error
          retention-days: 14
